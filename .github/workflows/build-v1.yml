name: Lab 02 - Exercício 02 - Build V1

on:
  push:
    branches: [main]
    paths:
      - 'exercise-02/**'
      - '.github/workflows/build-v1.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercise-02
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy code
        run: |
          echo "Deploying..."
          sleep 30

