name: Lab 02 - Exercício 01 - Simple Local

on:
  push:
    branches: [main]
    paths:
      - 'exercise-01/**'
      - '.github/workflows/simple-local.yml'
  workflow_dispatch:

jobs:
  build-node:
    runs-on: ubuntu-latest
    container: node:18
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: npm --version
      - run: npm install
        working-directory: exercise-01
      - name: Executar aplicação
        run: node app.js
        working-directory: exercise-01
      - name: Registre a execução
        run: sleep 30

